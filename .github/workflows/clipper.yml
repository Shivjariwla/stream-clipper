name: Auto Stream Clipper

on:
  schedule:
    - cron: '0 2,14,17,20,23 * * *'
  workflow_dispatch:

jobs:
  clip-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -U yt-dlp faster-whisper numpy requests cloudinary google-genai
      - env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
      - name: Save posted clip history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git diff --staged --quiet || (git commit -m "Update clip history" && git push)
