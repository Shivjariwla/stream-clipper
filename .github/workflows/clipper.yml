name: Auto Stream Clipper

on:
  schedule:
    - cron: '0 0,2,5,7,10,12,15,17,20,22 * * *'
  workflow_dispatch:

jobs:
  clip-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg nodejs

      - run: |
          pip install -U yt-dlp faster-whisper numpy requests cloudinary google-genai
          pip uninstall -y opencv-python opencv-contrib-python opencv-python-headless || true
          pip install --no-cache-dir opencv-python-headless

      - name: Run clipper
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: python main.py

      - name: Save posted clip history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json || true
          git commit -m "Update posted clip history" || exit 0
          git push
