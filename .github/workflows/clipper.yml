name: Auto Stream Clipper

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  clip-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg nodejs

      - run: |
          pip install -U "yt-dlp[default]" faster-whisper numpy requests cloudinary google-genai google-api-python-client google-auth-oauthlib
          pip uninstall -y opencv-python opencv-contrib-python opencv-python-headless || true
          pip install --no-cache-dir "opencv-contrib-python-headless<5"

      - name: Run clipper
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py

      - name: Save posted clip history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json || true
          git commit -m "Update posted clip history" || exit 0
          git push
